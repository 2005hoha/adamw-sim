seed: 0
device: cuda

model:
  vocab_size: 65
  d_model: 128
  n_head: 4
  n_layer: 4
  block_size: 128
  dropout: 0.1

optimizer:
  name: adamw
  lr: 3.0e-3
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1

train:
  batch_size: 256
  max_steps: 500
  warmup_steps: 50
  grad_clip: 1.0
  eval_interval: 50
  min_lr_ratio: 0.1
  scheduler: cosine